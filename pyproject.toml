[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "splatchain"
version = "0.1.0"
description = "Blockchain-verified Gaussian Splat provenance"
requires-python = ">=3.10"
dependencies = [
    "py-ed25519-ld>=0.1",
    "PyNaCl>=1.5",
    "requests>=2.31",
    "click>=8.1",
    "web3>=6.14",
]

[project.scripts]
splatchain = "splatchain.cli:main"

[tool.setuptools.packages.find]
include = ["splatchain*"]